[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchlab"
version = "0.1.0"
description = "Reproducible client-side benchmarks for LLM serving configurations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shaik Asif Ur Rehman" }]
keywords = ["llm", "benchmark", "inference", "latency", "throughput"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "huggingface_hub>=0.26",
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
local = ["transformers>=4.46", "accelerate>=0.34", "torch"]
gradio = ["gradio>=4.44"]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "types-PyYAML"]

[project.scripts]
benchlab = "benchlab.cli:main"

[project.urls]
Homepage = "https://github.com/asif-reh"
Documentation = "https://huggingface.co/Ki-Asif"

[tool.setuptools.packages.find]
include = ["benchlab*"]

[tool.setuptools.package-data]
benchlab = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["benchlab", "tests", "scripts", "gradio_space"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/serve_transformers.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["benchlab"]
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
